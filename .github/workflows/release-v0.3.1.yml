name: Publish v0.3.1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v0.3.1.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Publish v0.3.1 and move v0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$(git rev-parse "${GITHUB_SHA}^")"

          if git ls-remote --exit-code --tags origin refs/tags/v0.3.1 >/dev/null 2>&1; then
            echo "v0.3.1 already exists; refusing to overwrite immutable release tag"
            exit 1
          fi

          git tag v0.3.1 "$TARGET"
          git tag -f v0 "$TARGET"
          git push origin refs/tags/v0.3.1
          git push --force origin refs/tags/v0

          gh release create v0.3.1 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET" \
            --title "v0.3.1 — QA and repository hardening" \
            --notes "Release v0.3.1 aligns package metadata with the public GitHub release and includes repository QA hardening, current Orynval routes, pinned GitHub Action dependencies, self-scan regression guards, and Dependabot configuration. The zero-execution MCP scanning boundary is unchanged."
